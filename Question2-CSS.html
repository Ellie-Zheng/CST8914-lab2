<!DOCTYPE html>
<html lang="en">

<head>
  <title>Question 2 - CSS</title>

  <!--
  Accessibility changes for Question 2:
  1. Removed text-decoration: none; for the link to restore the default browser styling.
  2. Removed outline: none; for the link focus to restore the default browser styling.
  3. Replaced the image of text with a real text heading so the title can be read by screen readers and resized more easily.  
  -->

  <style>
    .mainsection a {
      color: #414040;
    }

    .mainsection h1 {
      display: inline-block;
      background-image: url(lab2/backgroundimg.gif);
      background-repeat: repeat;
      background-size: 1em 1em;
      padding: 0.5em 0.5em;
    }
    
  </style>
</head>

<body>
  <div class="mainsection">
    <h1>Shopping categories</h1>

    <ul>
      <li><a href="#">Animals</a></li>
      <li><a href="#">Computers</a></li>
      <li><a href="#">Diversity and inclusion</a></li>
      <li><a href="#">Food</a></li>
      <li><a href="#">Medicine</a></li>
      <li><a href="#">Music</a></li>
    </ul>
  </div>

</body>

</html>
