<!DOCTYPE html>
<html lang="en">

<head>
  <title>Question 2 - CSS</title>

  <!--
  Accessibility changes for Question 2:
  1. Replaced the image of text with a real text heading so the title can be read by screen readers and resized more easily.
  2. Underlined the links so they are clearly identifiable.
  3. Added a visible focus outline so keyboard users can tell which link currently has focus.
  -->

  <style>
    .mainsection a {
      text-decoration: underline;
      color: #414040;
      outline: none;
    }

    .mainsection a:focus-visible {
      outline: 3px solid #ee6a0b;
      outline-offset: 3px;
    }
    
  </style>
</head>

<body>
  <div class="mainsection">
    <h1>Shopping categories</h1>

    <ul>
      <li><a href="#">Animals</a></li>
      <li><a href="#">Computers</a></li>
      <li><a href="#">Diversity and inclusion</a></li>
      <li><a href="#">Food</a></li>
      <li><a href="#">Medicine</a></li>
      <li><a href="#">Music</a></li>
    </ul>
  </div>

</body>

</html>
