<!DOCTYPE html>
<html lang="en">

<head>
    <title>Question 4 - JavaScript</title>
</head>

<!--
Accessibility changes for Question 4:
Added an onfocus event to the button so keyboard users can display
"Hello World" by pressing Tab. The onmouseover event remains so the
mouse hover behavior still works.
-->

<body>
    <h1>HTML DOM Events</h1>
    <p>Trigger a function on hover that will output "Hello World":</p>

    <!-- Keep the mouse hover action and add focus so keyboard users
     can display the text by pressing Tab to reach the button. -->
    <button onmouseover="myFunction()" onfocus="myFunction()">Action!</button>
    <p id="demo"></p>

    <script>
        function myFunction() {
            // Suggestion: textContent would be more appropriate here because the output is plain text.
            document.getElementById("demo").innerHTML = "Hello World";
        }
    </script>
</body>

</html>
